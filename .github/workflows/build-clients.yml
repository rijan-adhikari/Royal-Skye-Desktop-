name: Build Royal Skye clients

on:
  workflow_dispatch:
  push:
    branches: [main, integration/pos-system-1.2.0]
    paths:
      - "app/frontend/**"
      - "app/backend/**"
      - "app/VERSION"
      - ".github/workflows/build-clients.yml"
  pull_request:
    branches: [main]

concurrency:
  group: royal-skye-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend-check:
    name: Backend syntax and billing tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies and test runner
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile backend modules
        working-directory: app/backend
        run: python -m compileall -q app scripts
      - name: Run backend unit tests
        working-directory: app/backend
        env:
          PYTHONPATH: .
        run: pytest -q

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        run: npm install
      - name: Generate native desktop icons from the official restaurant logo
        run: npx tauri icon public/images/logo.jpg
      - name: Build desktop packages
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: royal-skye-${{ matrix.target }}
          path: app/frontend/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build
      - name: Generate Android project and sync assets
        run: |
          npx cap add android
          npx cap sync android
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          
          source = Image.open("public/images/logo.jpg").convert("RGB")
          root = Path("android/app/src/main/res")
          densities = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in densities.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(source, (size, size), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              icon.save(folder / "ic_launcher.png", optimize=True)
              icon.save(folder / "ic_launcher_round.png", optimize=True)
          
          # Android adaptive icon: retain the restaurant mark inside the launcher safe zone.
          for density, size in {"mdpi":108, "hdpi":162, "xhdpi":216, "xxhdpi":324, "xxxhdpi":432}.items():
              folder = root / f"mipmap-{density}"
              canvas = Image.new("RGBA", (size, size), (16, 24, 32, 255))
              mark = ImageOps.contain(source, (int(size * 0.62), int(size * 0.62)), method=Image.Resampling.LANCZOS).convert("RGBA")
              canvas.alpha_composite(mark, ((size-mark.width)//2, (size-mark.height)//2))
              canvas.save(folder / "ic_launcher_foreground.png", optimize=True)
          
          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/royal_skye_icon_background"/>\n'
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (adaptive / "ic_launcher_round.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/royal_skye_icon_background"/>\n'
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          colors = root / "values"
          colors.mkdir(parents=True, exist_ok=True)
          (colors / "royal_skye_icon.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="royal_skye_icon_background">#101820</color></resources>\n'
          )
          print("Generated Android launcher icons from public/images/logo.jpg")
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          start = xml.index("<application")
          end = xml.index(">", start)
          tag = xml[start:end]
          for name, value in {
              "usesCleartextTraffic": "false",
              "networkSecurityConfig": "@xml/network_security_config",
              "allowBackup": "false",
          }.items():
              pattern = rf'android:{name}="[^"]*"'
              if re.search(pattern, tag):
                  tag = re.sub(pattern, f'android:{name}="{value}"', tag, count=1)
              else:
                  tag += f' android:{name}="{value}"'
          xml = xml[:start] + tag + xml[end:]
          ET.fromstring(xml)
          manifest.write_text(xml)
          network_config = Path("android/app/src/main/res/xml/network_security_config.xml")
          network_config.parent.mkdir(parents=True, exist_ok=True)
          network_config.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          """)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          version = Path("../VERSION").read_text().splitlines()[0].strip()
          major, minor, patch = (int(part) for part in version.split("."))
          version_code = major * 10000 + minor * 100 + patch
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text()
          content, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", content, count=1)
          content, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version}"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          gradle.write_text(content)
          print(f"Android versionName={version}, versionCode={version_code}")
          PY
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verify APK signature and package metadata
        working-directory: app/frontend/android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/royal-skye-apk-badging.txt
          grep -q "package: name='com.royalskye.restaurant'" /tmp/royal-skye-apk-badging.txt
          grep -q "sdkVersion:'23'" /tmp/royal-skye-apk-badging.txt
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/royal-skye-apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: royal-skye-android-debug-apk
          path: |
            app/frontend/android/app/build/outputs/apk/debug/*.apk
            royal-skye-apk.sha256
          if-no-files-found: error
          retention-days: 14

  release-android:
    name: Publish versioned Android APK release
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Release Royal Skye v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Read application version
        id: version
        run: echo "version=$(head -n1 app/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: royal-skye-android-debug-apk
          path: release-assets
      - name: Rename APK for release
        run: |
          APK="$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" "Royal-Skye-v${{ steps.version.outputs.version }}-android-debug.apk"
      - name: Publish private GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Royal Skye v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            Royal Skye Restaurant client v${{ steps.version.outputs.version }}.

            Android APK is debug-signed for early installation and testing. This is not the permanent production signing identity. Do not use it for live billing until local host, authentication, offline recovery, migration and printer acceptance tests pass.
          files: Royal-Skye-v${{ steps.version.outputs.version }}-android-debug.apk
